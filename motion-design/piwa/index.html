<title>PIWA AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Studio vidéo IA : réseau neuronal vivant en fond, console de génération au centre, sections en verre fumé sur noir profond */
:root{
  --bg:#06070A; --ink:#0C0E14; --panel:rgba(18,21,30,.72); --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --fg:#F4F5FA; --mute:#8D93A8; --c1:#8B5CF6; --c2:#22D3EE; --c3:#F472B6; --ok:#34D399;
  --sans:'Geist',system-ui,-apple-system,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-size:16.5px;line-height:1.6;margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;z-index:0;pointer-events:none;width:900px;height:900px;border-radius:50%;filter:blur(120px);opacity:.28}
.g1{background:var(--c1);top:-420px;left:-260px}.g2{background:var(--c2);top:-480px;right:-320px;opacity:.18}
.wrap{position:relative;z-index:1;max-width:1220px;margin:0 auto;padding-inline:20px;padding-block:16px 70px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(8,9,13,.66);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
.logo{display:flex;align-items:center;gap:9px}
.logo .wm{font-weight:800;font-size:22px;letter-spacing:-.04em}
.logo .ai{font-weight:800;font-size:12px;color:#fff;padding:3px 7px;border-radius:7px;background:linear-gradient(120deg,var(--c2),var(--c1),var(--c3))}
.mark{width:28px;height:28px;border-radius:8px;position:relative;background:conic-gradient(from 210deg,var(--c2),var(--c1),var(--c3),var(--c2));box-shadow:0 0 24px rgba(139,92,246,.55)}
.mark::after{content:"";position:absolute;inset:7px;border-radius:4px;background:var(--bg)}
.navr{display:flex;gap:10px;align-items:center}
.navr a{color:var(--mute);text-decoration:none;font-size:14px;padding:6px 8px}
.lang{font:500 13px var(--sans);color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;max-width:46vw}
.lang option{background:#0C0E14;color:#F4F5FA}
.hero{display:grid;grid-template-columns:1fr;gap:34px;padding-top:56px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line2);border-radius:999px;padding:6px 12px 6px 8px;background:rgba(255,255,255,.03)}
.eyebrow i{font-style:normal;color:var(--bg);background:linear-gradient(90deg,var(--c2),var(--c1));border-radius:999px;padding:2px 8px;font-weight:600;letter-spacing:.06em}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.035em}
h1{font-size:clamp(38px,6.2vw,80px);line-height:.98;font-weight:800;margin-top:22px}
.gt{background:linear-gradient(95deg,#fff 0%,#C7D2FE 30%,var(--c2) 55%,var(--c1) 80%,var(--c3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);font-size:clamp(17px,1.6vw,19px);max-width:52ch;margin-top:20px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--sans);border-radius:12px;padding:13px 20px;border:1px solid var(--line2);color:var(--fg);background:rgba(255,255,255,.04);text-decoration:none;cursor:pointer}
.btn.main{border:0;color:#fff;background:linear-gradient(95deg,var(--c1),#6366F1 50%,var(--c2));box-shadow:0 12px 40px -8px rgba(139,92,246,.7),inset 0 1px 0 rgba(255,255,255,.25)}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;color:var(--mute);font-size:14px}
.trust>span{display:inline-flex;gap:7px;align-items:center}
/* console */
.console{position:relative;border-radius:18px;padding:1px;background:linear-gradient(140deg,rgba(34,211,238,.7),rgba(139,92,246,.6) 40%,rgba(244,114,182,.5) 80%,rgba(255,255,255,.1));box-shadow:0 40px 120px -20px rgba(139,92,246,.45)}
.cin{border-radius:17px;background:linear-gradient(180deg,#0F1119,#0A0B11);overflow:hidden}
.ctop{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ctop b{width:10px;height:10px;border-radius:50%;background:#2A2E3A}
.ctop span{margin-left:8px;font:500 12px var(--mono);color:var(--mute)}
.prompt{padding:16px 16px 6px;font:400 14.5px/1.55 var(--mono);color:#DDE1F0;min-height:84px}
.prompt .u{color:var(--c2)}
.caret{display:inline-block;width:8px;height:16px;background:var(--c2);vertical-align:-3px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px 16px 14px}
.pp{font:500 11px var(--mono);letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:8px;padding:7px 6px;text-align:center;transition:all .3s;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp.run{color:#fff;border-color:rgba(34,211,238,.6);box-shadow:0 0 18px rgba(34,211,238,.25)}
.pp.done{color:var(--ok);border-color:rgba(52,211,153,.45)}
.prog{height:3px;background:var(--line);margin:0 16px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c1),var(--c3));transition:width .25s linear}
.vid{position:relative;margin:14px 16px 16px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid video,.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.vid .veil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(10,11,17,.35),rgba(10,11,17,.9));font:500 13px var(--mono);color:var(--c2);letter-spacing:.1em;text-transform:uppercase;transition:opacity .6s}
.vfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.chip{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:7px;border:1px solid var(--line2);color:var(--mute);background:transparent}
.chip.ok{color:var(--ok);border-color:rgba(52,211,153,.45)}
button.chip{cursor:pointer;color:var(--fg)}
.consent{display:flex;gap:9px;align-items:flex-start;color:var(--mute);font-size:13.5px;margin-top:12px}
/* sections */
section{margin-top:110px}
.kick{font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c2)}
h2{font-size:clamp(28px,4.2vw,52px);font-weight:800;line-height:1.02;margin-top:12px;max-width:20ch}
.sub{color:var(--mute);max-width:60ch;margin-top:14px}
.bento{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:34px}
.bx{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0;position:relative;overflow:hidden}
.bx h3{font-size:19px;letter-spacing:-.02em;margin-top:14px}
.bx p{margin:8px 0 0;color:var(--mute);font-size:15px}
.ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,rgba(34,211,238,.18),rgba(139,92,246,.22));border:1px solid var(--line2)}
.bx .big{font-size:clamp(34px,4vw,48px);font-weight:800;letter-spacing:-.04em}
.wave{display:flex;gap:3px;align-items:center;height:34px;margin-top:14px}
.wave i{width:4px;border-radius:3px;background:linear-gradient(var(--c2),var(--c1));animation:wv 1.2s ease-in-out infinite}
@keyframes wv{0%,100%{height:20%}50%{height:100%}}
.langs{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.lg{font:500 14px var(--sans);padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--fg)}
.lg.top{border-color:transparent;background:linear-gradient(var(--ink),var(--ink)) padding-box,linear-gradient(120deg,var(--c2),var(--c1)) border-box;border:1px solid transparent}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:34px}
.tile{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--ink);min-width:0;transition:transform .3s,border-color .3s}
.tile:hover{transform:translateY(-4px);border-color:var(--line2)}
.media{position:relative;aspect-ratio:16/9;background:#000;cursor:pointer}
.media img,.media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
.tile .t{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 14px}
.tile .t b{font-size:15px;font-weight:600;letter-spacing:-.01em}
.note{color:var(--mute);font-size:13.5px;margin-top:16px;max-width:85ch}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:34px}
.pc{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--panel);display:flex;flex-direction:column;gap:10px;min-width:0}
.pc.hot{background:linear-gradient(var(--ink),var(--ink)) padding-box,linear-gradient(140deg,var(--c2),var(--c1),var(--c3)) border-box;border:1px solid transparent;box-shadow:0 30px 90px -30px rgba(139,92,246,.6)}
.pc h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.amt{font-size:42px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.amt small{font:500 12px var(--mono);color:var(--mute);letter-spacing:.04em;margin-left:6px}
.pc p{margin:0;color:var(--mute);font-size:14.5px}
.pc ul{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
.pc li{display:flex;gap:8px;align-items:flex-start}
.badge{align-self:flex-start;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#fff;padding:4px 9px;border-radius:999px;background:linear-gradient(90deg,var(--c1),var(--c3))}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:34px;counter-reset:f}
.fl{border-top:1px solid var(--line2);padding-top:16px;min-width:0}
.fl .d{font:500 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c3)}
.fl h3{font-size:19px;margin-top:6px}
.fl p{margin:6px 0 0;color:var(--mute);font-size:15px}
.contact{margin-top:34px;border-radius:22px;padding:clamp(22px,4vw,48px);border:1px solid var(--line2);background:radial-gradient(100% 120% at 0% 0%,rgba(139,92,246,.32),transparent 60%),radial-gradient(100% 120% at 100% 100%,rgba(34,211,238,.22),transparent 60%),var(--ink);display:grid;gap:16px}
.num{font-size:clamp(30px,6vw,60px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;user-select:all}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
footer{margin-top:70px;padding-top:18px;border-top:1px solid var(--line);color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
a:focus-visible,button:focus-visible{outline:2px solid var(--c2);outline-offset:3px}
@media (min-width:980px){.hero{grid-template-columns:1.02fr 1fr;gap:48px}.navr a{display:inline}}
@media (max-width:700px){.navr a{display:none}.pipe{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.caret,.wave i{animation:none}.tile{transition:none}}
[dir="rtl"] .pipe,[dir="rtl"] .prompt{direction:ltr;text-align:left}

/* ---------- intro : entrée dans l'agence ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#020306;overflow:hidden;display:block}
#intro.gone{display:none}
#intro .s3d{position:absolute;inset:0;perspective:620px;perspective-origin:50% 50%}
#intro .tun{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
#intro .wall{position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:visible;
  background-color:rgba(14,16,32,.92);
  background-image:linear-gradient(rgba(139,92,246,.95) 3px,transparent 3px),linear-gradient(90deg,rgba(34,211,238,.85) 3px,transparent 3px),radial-gradient(ellipse at 50% 50%,rgba(139,92,246,.18),transparent 70%);
  background-size:240px 240px,240px 240px,100% 100%;box-shadow:inset 0 0 120px rgba(34,211,238,.25)}
#intro .lw,#intro .rw{width:9000px;height:900px}
#intro .fl,#intro .cl{width:1500px;height:9000px}
#intro .pan{position:absolute;left:0;top:0;width:560px;height:315px;border-radius:14px;overflow:hidden;transform-origin:50% 50%;
  box-shadow:0 0 60px rgba(139,92,246,.8),0 0 0 3px rgba(34,211,238,.9);background:#000}
#intro .pan img{width:100%;height:100%;object-fit:cover;display:block}
#intro .fog{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(139,92,246,.25) 0,transparent 14%,transparent 60%,rgba(2,3,6,.45) 100%);pointer-events:none}
#intro .portal{position:absolute;left:50%;top:50%;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;
  background:radial-gradient(circle,#fff 0,#E9D5FF 18%,rgba(139,92,246,.85) 40%,rgba(34,211,238,.4) 62%,transparent 72%);opacity:0;will-change:transform}
#intro .lg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;opacity:0}
#intro .lg svg{width:min(78vw,620px);height:auto;overflow:visible}
#intro .tag{font:500 13px var(--mono);letter-spacing:.32em;text-transform:uppercase;color:#C7D2FE;opacity:0}
#intro .skip{position:absolute;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));font:600 14px var(--sans);color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:10px 18px;cursor:pointer;z-index:2}
#intro .rays{position:absolute;inset:-20%;-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%);mask-image:radial-gradient(circle,#000 10%,transparent 60%);background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(139,92,246,.10) 0 3deg,transparent 3deg 12deg);opacity:0;mix-blend-mode:screen}
</style>

<div id="intro" aria-label="PIWA AI">
  <div class="s3d"><div class="tun" id="tun"></div></div>
  <div class="fog"></div>
  <div class="rays" id="rays"></div>
  <div class="portal" id="portal"></div>
  <div class="lg" id="ilg">
    <svg viewBox="0 0 490 140" aria-hidden="true">
      <defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient>
      <linearGradient id="igt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7D2FE"/></linearGradient>
      <clipPath id="iclip"><rect id="iclipr" x="140" y="0" width="0" height="140"/></clipPath>
      <filter id="iglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <g transform="translate(10,10)">
        <rect id="ibox" x="2" y="2" width="116" height="116" rx="32" fill="none" stroke="url(#ig)" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        <g stroke="url(#ig)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iglow)">
          <path id="itri" d="M44 34 L44 86 L88 60 Z" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
          <path id="inet" d="M44 60 L66 47 M44 60 L66 73 M66 47 L66 73" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
        </g>
        <g fill="#fff" id="inodes"><circle cx="44" cy="34" r="7"/><circle cx="44" cy="86" r="7"/><circle cx="88" cy="60" r="8"/><circle cx="44" cy="60" r="5"/><circle cx="66" cy="47" r="5"/><circle cx="66" cy="73" r="5"/></g>
      </g>
      <g clip-path="url(#iclip)"><text x="152" y="98" font-family="Geist, Arial, sans-serif" font-weight="800" font-size="92" letter-spacing="-4" fill="url(#igt)">piwa</text></g>
      <g id="iai" transform="translate(372,38)"><rect width="104" height="64" rx="18" fill="url(#ig)"/><text x="52" y="46" text-anchor="middle" font-family="Geist, Arial, sans-serif" font-weight="800" font-size="40" fill="#fff">AI</text></g>
    </svg>
    <div class="tag" id="itag" data-k="itag">Studio vidéo IA</div>
  </div>
  <button type="button" class="skip" id="skip" data-k="skip">Passer ›</button>
</div>

<canvas id="net" aria-hidden="true"></canvas>
<div class="glow g1" aria-hidden="true"></div><div class="glow g2" aria-hidden="true"></div>

<div class="wrap">
  <nav>
    <div class="logo"><svg width="30" height="30" viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="nm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs><rect width="120" height="120" rx="34" fill="url(#nm)"/><rect x="4" y="4" width="112" height="112" rx="30" fill="#0B0D14"/><g stroke="url(#nm)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M44 34L44 86L88 60Z"/><path d="M44 60L66 47M44 60L66 73M66 47L66 73"/></g><g fill="#fff"><circle cx="44" cy="34" r="8"/><circle cx="44" cy="86" r="8"/><circle cx="88" cy="60" r="9"/></g></svg><span class="wm">piwa</span><span class="ai">AI</span></div>
    <div class="navr">
      <a href="#work" data-k="nav_work"></a><a href="#pricing" data-k="nav_pricing"></a><a href="#contact" data-k="nav_contact"></a>
      <select class="lang" id="lang" aria-label="Langue / Language"></select>
    </div>
  </nav>

  <div class="hero">
    <div>
      <span class="eyebrow"><i>AI</i><span data-k="eyebrow"></span></span>
      <h1 data-k="h1" data-html="1"></h1>
      <p class="lead" data-k="lead"></p>
      <div class="cta"><a class="btn main" href="#contact"><span data-k="cta1"></span> →</a><a class="btn" href="#work" data-k="cta2"></a></div>
      <div class="trust"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6L9 17l-5-5"/></svg><span data-k="t1"></span></span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6L9 17l-5-5"/></svg><span data-k="t2"></span></span><span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 6L9 17l-5-5"/></svg><span data-k="t3"></span></span></div>
    </div>
    <div>
      <div class="console"><div class="cin">
        <div class="ctop"><b></b><b></b><b></b><span>piwa.ai / generate</span></div>

        <div class="pipe" id="pipe"></div>
        <div class="prog"><i id="bar"></i></div>
        <div class="vid"><img src="videos/noxem-menuiseries.jpg" alt=""><video id="hero" muted loop playsinline preload="none"></video><div class="scan"></div><div class="veil" id="veil"><span data-k="gen"></span></div></div>
        <div class="vfoot"><div class="row" style="gap:8px"><span class="chip ok" data-k="real"></span><span class="chip">NOXEM GROUP · 48 s</span></div><button type="button" class="chip" id="sound" data-k="sound"></button></div>
      </div></div>
      <p class="consent"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34D399" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:3px"><path d="M20 6L9 17l-5-5"/></svg><span data-k="consent"></span></p>
    </div>
  </div>

  <section>
