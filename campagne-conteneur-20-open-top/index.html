      var tr = document.createElement('tr');
      tr.innerHTML = '<td><span class="swatch" style="background:' + p.c + '"></span>' + t[p.k] + '</td>' +
        '<td class="mono">' + p.thk + '</td><td class="mono">' + p.fmt + ' mm</td>';
      body.appendChild(tr);
    });

    var links = waMail();
    $('waHero').href = links.wa; $('waCta').href = links.wa; $('waFloat').href = links.wa;
    $('mailHero').href = links.mail; $('mailCta').href = links.mail;

    $('portsWorld').textContent = t.portsWorld
      .replace('{n}', nf(nPorts)).replace('{p}', nf(C.length));

    drawPorts();
    calc();
  }

  function waMail(){
    var t = P[lang];
    return {
      wa: 'https://wa.me/' + WA + '?text=' + encodeURIComponent(t.waText),
      mail: 'mailto:' + MAIL + '?subject=' + encodeURIComponent(t.mailSubject) +
            '&body=' + encodeURIComponent(t.mailBody)
    };
  }

  /* ---------- calculateur de chargement ---------- */
  function initCalc(){
    THICKNESS.forEach(function(v){
      var o = document.createElement('option'); o.value = v; o.textContent = v + ' mm';
      if(v === 6) o.selected = true; $('cThk').appendChild(o);
    });
    FORMATS.forEach(function(f){
      var o = document.createElement('option'); o.value = f.id;
      o.textContent = f.l + ' × ' + f.h + ' mm'; $('cFmt').appendChild(o);
    });
    CONTAINERS.forEach(function(c){
      var o = document.createElement('option'); o.value = c.id; o.textContent = c.label; $('cCont').appendChild(o);
    });
    ['cThk','cFmt','cCont','cPay'].forEach(function(id){
      $(id).addEventListener('change', function(){
        if(id === 'cCont'){
          var c = CONTAINERS.filter(function(x){ return x.id === $('cCont').value; })[0];
          $('cPay').value = c.pay;
        }
        calc();
      });
      $(id).addEventListener('input', calc);
    });
  }

  function calc(){
    var thk = parseFloat($('cThk').value);
    var fmt = FORMATS.filter(function(f){ return f.id === $('cFmt').value; })[0];
    var cont = CONTAINERS.filter(function(c){ return c.id === $('cCont').value; })[0];
    var pay = parseFloat($('cPay').value);
    if(!thk || !fmt || !cont || !pay || pay <= 0) return;

    var area = (fmt.l / 1000) * (fmt.h / 1000);          /* m² par feuille */
    var wSheet = area * 2.5 * thk;                        /* kg : 2,5 kg/m² par mm */
    var byWeight = Math.floor(pay * 1000 / wSheet);
    /* épaisseur de pile : verre + intercalaire, plus un chevalet par 2,5 t environ */
    var perSheet = thk + 0.4;
    var byLength = Math.floor(cont.len / perSheet);
    var sheets = Math.max(0, Math.min(byWeight, byLength));
    var stands = Math.max(1, Math.ceil(sheets * wSheet / 2500));
    var stack = (sheets * perSheet + stands * 120) / 1000;
    if(stack > cont.len / 1000){
      sheets = Math.floor((cont.len - stands * 120) / perSheet);
      stack = (sheets * perSheet + stands * 120) / 1000;
    }
    $('rSheets').textContent = nf(sheets);
    $('rSqm').textContent = nf(sheets * area);
    $('rWeight').textContent = nf(sheets * wSheet / 1000, 1) + ' t';
    $('rStack').textContent = nf(stack, 2) + ' m';
  }

  /* ---------- ports ---------- */
  function drawPorts(){
    var q = ($('portSearch').value || '').trim().toLowerCase();
    var box = $('portsList'), fr = (lang === 'fr');
    box.innerHTML = '';
    Object.keys(R).forEach(function(rk){
      var rows = C.filter(function(c){
        if(c.r !== rk) return false;
        if(!q) return true;
        return (c.fr + ' ' + c.en + ' ' + c.p.join(' ')).toLowerCase().indexOf(q) !== -1;
      });
      if(!rows.length) return;
      var div = document.createElement('div');
      div.className = 'pr-reg';
      var html = '<h3>' + (fr ? R[rk].fr : R[rk].en) + '</h3>';
      rows.forEach(function(c){
        html += '<div class="pr-c"><b>' + (fr ? c.fr : c.en) + '</b> <span>' +
          c.p.join(', ') + ' · ' + c.t + ' j</span></div>';
      });
      div.innerHTML = html;
      box.appendChild(div);
    });
    if(!box.children.length){
      box.innerHTML = '<div class="pr-c"><span>—</span></div>';
    }
  }

  /* ---------- compteurs ---------- */
  var NAMED = /^(via |rail |route )/;
  var ports = {};
  C.forEach(function(c){ c.p.forEach(function(p){ if(!NAMED.test(p)) ports[p] = 1; }); });
  var nPorts = Object.keys(ports).length;
  $('nCountries').textContent = C.length;
  $('nPorts').textContent = nPorts;

  sel.addEventListener('change', function(){
    lang = sel.value;
    try{ localStorage.setItem('noxem_camp_lang', lang); }catch(e){}
    apply();
  });
  $('portSearch').addEventListener('input', drawPorts);

  initCalc();
  lang = detect();
  apply();
})();
</script>
</body>
</html>
