<!--
  Bandeau d'en-tête des e-mails Noxem Group — illustration vectorielle originale.
  Charte : bleu nuit #0F2942, cyan #00A9B7. Aucun visuel tiers, aucun droit à acquérir.
  Exporté en PNG (2x) par emails/build-banniere.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" width="620" height="200" role="img"
     aria-label="Noxem Group — station de gonflage en libre accès financée par le dispositif CEE">
  <rect width="620" height="200" fill="#0F2942"/>
  <!-- Filet cyan supérieur -->
  <rect x="0" y="0" width="620" height="4" fill="#00A9B7"/>

  <!-- Bloc texte -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="36" y="30" width="74" height="22" rx="4" fill="#00A9B7"/>
    <text x="45" y="46" font-size="13" font-weight="700" fill="#04222C" letter-spacing="1.6">NOXEM</text>
    <text x="118" y="46" font-size="12" fill="#9FB6C9" letter-spacing="0.6">GROUP</text>

    <text x="36" y="92" font-size="23" font-weight="700" fill="#FFFFFF">Station de gonflage</text>
    <text x="36" y="120" font-size="23" font-weight="700" fill="#00A9B7">en libre accès</text>

    <text x="36" y="150" font-size="12.5" fill="#B9CBD9">Financée en grande partie par le dispositif CEE</text>
    <text x="36" y="168" font-size="11.5" fill="#7E97AB">Fiche officielle TRA-SE-104 — encadrée par l’État</text>
  </g>

  <!-- Badge : la gratuité ne concerne QUE l'usager, jamais le site -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="438" y="14" width="158" height="24" rx="12" fill="#00A9B7"/>
    <text x="517" y="30" text-anchor="middle" font-size="11" font-weight="700"
          fill="#04222C" letter-spacing="0.4">GRATUIT POUR L’USAGER</text>
  </g>

  <!-- Illustration : borne de gonflage et pneu (tracé original) -->
  <g fill="none" stroke="#00A9B7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Sol -->
    <path d="M446 176 H596" stroke="#1F5876" stroke-width="5"/>
    <!-- Corps de la borne -->
    <rect x="452" y="62" width="44" height="114" rx="7"/>
    <!-- Écran et courbe de pression -->
    <rect x="461" y="72" width="26" height="20" rx="3" stroke="#7FD9E1"/>
    <path d="M466 86 l5 -7 5 4 5 -8" stroke="#7FD9E1" stroke-width="1.8"/>
    <!-- Boutons -->
    <circle cx="467" cy="106" r="3.4" stroke="#7FD9E1"/>
    <circle cx="481" cy="106" r="3.4" stroke="#7FD9E1"/>
    <!-- Enrouleur -->
    <circle cx="474" cy="130" r="9"/>
    <!-- Flexible et embout -->
    <path d="M483 130 C 508 132, 518 148, 513 166"/>
    <path d="M513 166 l-7 5" stroke-width="3"/>
    <!-- Pneu -->
    <circle cx="556" cy="140" r="30" stroke="#7FD9E1"/>
    <circle cx="556" cy="140" r="13" stroke="#7FD9E1"/>
  </g>
</svg>
