<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Déstockage Verre Plat — NOXEM GROUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF8F3;
  --paper-2:#F0ECE1;
  --ink:#1E2430;
  --ink-soft:#585F6E;
  --red:#B5261F;
  --amber:#C97A2E;
  --beige:#B7A06E;
  --line: rgba(30,36,48,0.15);
  --line-strong: rgba(30,36,48,0.40);
  --card:#FFFFFF;
}
*{box-sizing:border-box;}
html{background:var(--paper);}
body{background:var(--paper); color:var(--ink); font-family:"Public Sans",system-ui,sans-serif; line-height:1.4; margin:0;}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif; font-weight:700; text-wrap:balance; margin:0; color:var(--ink);}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.eyebrow-txt{font-family:"IBM Plex Mono"; font-size:11px; text-transform:uppercase; letter-spacing:0.09em; color:var(--ink-soft);}
a{color:inherit;}
.wrap{max-width:1060px; margin-inline:auto; padding-inline:24px;}
img,video{max-width:100%; display:block;}
button{font:inherit;}

.topbar{position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--ink);}
.topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-block:14px;}
.brand img{height:30px; width:auto; display:block;}
.top-right{display:flex; align-items:center; gap:10px;}
.lang-select{font-family:"IBM Plex Mono"; font-size:12.5px; background:var(--paper); color:var(--ink); border:1px solid var(--ink); padding:8px 10px; cursor:pointer;}
.top-cta{display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--paper); padding:9px 16px; font-weight:600; font-size:13px; text-decoration:none; white-space:nowrap; border:1px solid var(--ink);}
.top-cta:hover{background:var(--red); border-color:var(--red);}
.top-cta svg{width:15px; height:15px; flex:none;}

.hero{border-bottom:1px solid var(--line);}
.hero-grid{display:grid; grid-template-columns:1.2fr 1fr; gap:0; align-items:stretch;}
@media (max-width:860px){ .hero-grid{grid-template-columns:1fr;} }
.hero-copy{padding-block:44px 40px; padding-right:36px;}
@media (max-width:860px){ .hero-copy{padding-right:0;} }
.eyebrow{display:inline-flex; align-items:center; gap:8px; font-family:"IBM Plex Mono"; font-size:11.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--red); border-left:3px solid var(--red); padding-left:10px;}
h1.hero-title{font-size:clamp(30px,4.4vw,44px); line-height:1.08; margin-top:16px; letter-spacing:-0.01em;}
h1.hero-title .accent{color:var(--red);}
.hero-sub{margin-top:16px; font-size:16px; line-height:1.6; color:var(--ink-soft); max-width:48ch;}
.hero-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:26px;}
.btn{display:inline-flex; align-items:center; gap:9px; padding:14px 22px; font-weight:600; font-size:14.5px; text-decoration:none; border:1px solid var(--ink); cursor:pointer; background:none; color:var(--ink);}
.btn-primary{background:var(--ink); color:var(--paper);}
.btn-primary:hover{background:var(--red); border-color:var(--red);}
.btn-outline{background:transparent; color:var(--ink); border-color:var(--line-strong);}
.btn-outline:hover{border-color:var(--ink);}
.btn svg{width:17px; height:17px; flex:none;}

.hero-photo{position:relative; border-left:1px solid var(--line); overflow:hidden; background:var(--paper-2);}
.hero-photo img{width:100%; height:100%; object-fit:cover;}
@media (max-width:860px){ .hero-photo{border-left:none; border-top:1px solid var(--line); aspect-ratio:16/10;} }
.tag-devis{position:absolute; top:0; right:0; background:var(--ink); color:var(--paper); font-family:"IBM Plex Mono"; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; padding:9px 14px;}
.tag-devis b{color:var(--red);}

.manifest{background:var(--ink); color:var(--paper); border-bottom:1px solid var(--ink);}
.manifest .wrap{display:grid; grid-template-columns:repeat(4,1fr); padding-block:0;}
@media (max-width:760px){ .manifest .wrap{grid-template-columns:repeat(2,1fr);} }
.manifest-item{padding:20px 16px; border-right:1px solid rgba(250,248,243,0.16); border-top:1px solid rgba(250,248,243,0.16);}
.manifest .wrap>*:nth-child(4n){border-right:none;}
@media (max-width:760px){ .manifest .wrap>*:nth-child(2n){border-right:none;} .manifest .wrap>*:nth-child(4n){border-right:1px solid rgba(250,248,243,0.16);} }
.manifest-num{font-family:"Archivo"; font-weight:700; font-size:24px; line-height:1;}
.manifest-label{font-family:"IBM Plex Mono"; font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; opacity:0.62; margin-top:5px;}

section{padding-block:56px; border-bottom:1px solid var(--line);}
section:last-of-type{border-bottom:none;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:26px;}
.section-head h2{font-size:clamp(21px,3vw,28px);}

.stock-table{width:100%; border-collapse:collapse; font-size:14.5px;}
.stock-table thead th{text-align:left; font-family:"IBM Plex Mono"; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-weight:600; padding:0 10px 12px; border-bottom:1px solid var(--ink);}
.stock-table td{padding:15px 10px; border-bottom:1px solid var(--line);}
.ref-name{font-weight:600;}
.ref-swatch{display:inline-block; width:10px; height:10px; margin-right:9px; vertical-align:middle; border:1px solid var(--line-strong);}
.devis-pill{font-family:"IBM Plex Mono"; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); border:1px solid var(--line-strong); padding:3px 9px; white-space:nowrap;}
.stock-table tfoot td{padding-top:18px; font-weight:700; border-top:2px solid var(--ink); border-bottom:none;}
.tbl-scroll{overflow-x:auto;}

.filmstrip{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line);}
@media (max-width:760px){ .filmstrip{grid-template-columns:repeat(2,1fr);} }
.frame{background:var(--card);}
.frame img{aspect-ratio:4/5; object-fit:cover; width:100%;}
.frame-cap{padding:14px 14px 16px;}
.frame-step{font-family:"IBM Plex Mono"; font-size:10.5px; letter-spacing:0.04em; color:var(--red); font-weight:600; text-transform:uppercase;}
.frame-cap p{margin:5px 0 0; font-size:13px; line-height:1.45; color:var(--ink-soft);}

.builder{border:1px solid var(--ink);}
.builder-head{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:18px 22px; border-bottom:1px solid var(--ink); background:var(--paper-2);}
.builder-head h3{font-size:18px;}
.toggle-all{display:flex; align-items:center; gap:9px; font-family:"IBM Plex Mono"; font-size:12px; cursor:pointer; user-select:none;}
.toggle-all input{width:15px; height:15px; accent-color:var(--ink);}
.line-item{display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:16px 22px; border-bottom:1px solid var(--line);}
@media (max-width:640px){ .line-item{grid-template-columns:1fr;} .line-item .stepper-col{justify-self:start;} }
.li-swatch{width:30px; height:30px; border:1px solid var(--line-strong); flex:none;}
.li-info b{display:block; font-size:14.5px; font-weight:600;}
.li-info .li-mono{font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--ink-soft); display:block; margin-top:3px;}
.stepper{display:flex; align-items:center; border:1px solid var(--ink); height:38px;}
.stepper button{width:36px; height:100%; border:none; background:var(--paper); color:var(--ink); font-size:17px; cursor:pointer; line-height:1;}
.stepper button:disabled{opacity:0.3; cursor:not-allowed;}
.stepper button:not(:disabled):hover{background:var(--ink); color:var(--paper);}
.stepper .count{width:82px; text-align:center; font-family:"IBM Plex Mono"; font-weight:600; font-size:13.5px; border-inline:1px solid var(--ink);}
.stepper .count small{display:block; font-weight:400; font-size:10px; color:var(--ink-soft); margin-top:1px;}

.builder-foot{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; padding:20px 22px; background:var(--ink); color:var(--paper);}
@media (max-width:640px){ .builder-foot{grid-template-columns:1fr;} }
.total-label{font-family:"IBM Plex Mono"; font-size:10.5px; text-transform:uppercase; letter-spacing:0.07em; opacity:0.62;}
.total-value{font-family:"Archivo"; font-weight:700; font-size:26px; margin-top:3px;}
.price-row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.price-input{display:flex; align-items:center; gap:8px; background:rgba(250,248,243,0.08); border:1px solid rgba(250,248,243,0.35); padding:0 12px; height:44px;}
.price-input input{background:transparent; border:none; color:var(--paper); font-family:"IBM Plex Mono"; font-size:14.5px; width:120px; outline:none;}
.price-input input::placeholder{color:rgba(250,248,243,0.45);}
.price-input span{font-family:"IBM Plex Mono"; font-size:13px; opacity:0.7;}
.send-btn{display:inline-flex; align-items:center; gap:8px; background:var(--red); color:#fff; border:1px solid var(--red); padding:0 20px; height:44px; font-weight:600; font-size:14.5px; cursor:pointer;}
.send-btn:hover{background:var(--paper); color:var(--ink);}
.send-btn svg{width:17px; height:17px;}
.send-btn:disabled{opacity:0.35; cursor:not-allowed;}

.logistics{border:1px solid var(--line); display:grid; grid-template-columns:1.1fr 1fr;}
@media (max-width:760px){ .logistics{grid-template-columns:1fr;} }
.logistics-copy{padding:30px 32px;}
.logistics ul{list-style:none; margin:16px 0 0; padding:0; display:grid; gap:12px;}
.logistics li{display:flex; gap:11px; font-size:14.5px; line-height:1.5;}
.logistics li svg{width:17px; height:17px; flex:none; color:var(--red); margin-top:2px;}
.logistics-photo{border-left:1px solid var(--line);}
@media (max-width:760px){ .logistics-photo{border-left:none; border-top:1px solid var(--line);} }
.logistics-photo img{width:100%; height:100%; object-fit:cover;}

.gallery{display:grid; grid-template-columns:2fr 1fr; gap:1px; background:var(--line);}
@media (max-width:760px){ .gallery{grid-template-columns:1fr;} }
.gallery img{width:100%; height:100%; object-fit:cover; display:block;}
.gallery figure{margin:0; background:var(--card);}

.contact{background:var(--ink); color:var(--paper); padding:44px 32px; text-align:center;}
.contact h2{color:var(--paper); font-size:clamp(22px,3.6vw,32px);}
.contact p{color:rgba(250,248,243,0.72); max-width:52ch; margin:14px auto 0; font-size:15px; line-height:1.6;}
.contact-actions{display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:26px;}
.contact-actions .btn-primary{background:var(--red); border-color:var(--red); padding:15px 26px; font-size:15px;}
.contact-actions .btn-primary:hover{background:var(--paper); color:var(--ink);}
.contact-actions .btn-outline{border-color:rgba(250,248,243,0.35); color:var(--paper);}
.contact-actions .btn-outline:hover{border-color:#fff;}
.tel-num{font-family:"IBM Plex Mono"; letter-spacing:0.02em;}

footer{padding-block:22px;}
footer .wrap{display:flex; flex-wrap:wrap; justify-content:space-between; gap:10px; font-size:12px; color:var(--ink-soft);}
</style>
</head>

    filmstrip.innerHTML = '';
    t.filmstrip.forEach(function(f, i){
      var div = document.createElement('div');
      div.className = 'frame';
      div.innerHTML = '<img src="'+filmSrcs[i]+'" alt="'+f.alt.replace(/"/g,'&quot;')+'">'+
        '<div class="frame-cap"><div class="frame-step">'+f.step+'</div><p>'+f.text+'</p></div>';
      filmstrip.appendChild(div);
    });
  }

  function renderStockTable(t){
    var totalCratesAll = REF_DEFS.reduce(function(a,r){return a+r.crates;},0);
    document.getElementById('totalCrates').textContent = totalCratesAll + ' ' + t.cratePlural;

    var stockBody = document.getElementById('stockBody');
    stockBody.innerHTML = '';
    REF_DEFS.forEach(function(r){
      var name = t.refNames[r.key];
      var tr = document.createElement('tr');
      tr.innerHTML = '<td><span class="ref-swatch" style="background:'+r.color+'"></span><span class="ref-name">'+name+'</span></td>'+
        '<td class="mono">'+r.thickness+'</td>'+
        '<td class="mono">2550×3210 mm</td>'+
        '<td class="mono">'+r.crates+'</td>'+
        '<td class="mono">'+fmt(r.sqm)+' m²</td>'+
        '<td><span class="devis-pill">'+t.devisPill+'</span></td>';
      stockBody.appendChild(tr);
    });
  }

  function renderBuilder(t){
    var lineItems = document.getElementById('lineItems');
    lineItems.innerHTML = '';
    REF_DEFS.forEach(function(r, i){
      var name = t.refNames[r.key];
      var row = document.createElement('div');
      row.className = 'line-item';
      row.innerHTML =
        '<div class="li-swatch" style="background:'+r.color+'"></div>'+
        '<div class="li-info"><b>'+name+' — '+r.thickness+'</b><span class="li-mono">2550×3210 mm · '+fmt(r.sqm)+' m² · '+r.crates+' '+t.cratePlural+'</span></div>'+
        '<div class="stepper-col"><div class="stepper">'+
          '<button type="button" class="minus" aria-label="'+t.ariaMinus+'">−</button>'+
          '<div class="count mono"><b>0</b><small>≈ 0 m²</small></div>'+
          '<button type="button" class="plus" aria-label="'+t.ariaPlus+'">+</button>'+
        '</div></div>';
      lineItems.appendChild(row);
      row.querySelector('.minus').addEventListener('click', function(){ if(state[i]>0){ state[i]--; refresh(); } });
      row.querySelector('.plus').addEventListener('click', function(){ if(state[i]<r.crates){ state[i]++; refresh(); } });
    });
  }

  function refresh(){
    var t = I18N[lang];
    var lineItems = document.getElementById('lineItems');
    lineItems.querySelectorAll('.count b').forEach(function(el, i){ el.textContent = state[i]; });
    lineItems.querySelectorAll('.count small').forEach(function(el, i){
      var r = REF_DEFS[i];
      el.textContent = '≈ ' + fmt(state[i]*perCrate(r),0) + ' m²';
    });
    lineItems.querySelectorAll('.minus').forEach(function(btn,i){ btn.disabled = state[i] <= 0; });
    lineItems.querySelectorAll('.plus').forEach(function(btn,i){ btn.disabled = state[i] >= REF_DEFS[i].crates; });

    var totalCrates = state.reduce(function(a,v){return a+v;},0);
    var totalSqm = state.reduce(function(a,v,i){return a+v*perCrate(REF_DEFS[i]);},0);
    document.getElementById('footTotal').textContent = fmt(totalSqm,0) + ' m² — ' + totalCrates + ' ' + crateWord(totalCrates, t);
    document.getElementById('sendBtn').disabled = totalCrates <= 0;

    var allFull = state.every(function(v,i){ return v === REF_DEFS[i].crates; });
    document.getElementById('selectAll').checked = allFull;

    try{
      localStorage.setItem('noxem_destock_selection', JSON.stringify(state));
      localStorage.setItem('noxem_destock_offer', document.getElementById('offerPrice').value || '');
    }catch(e){}
  }

  function buildMessage(){
    var t = I18N[lang];
    var lines = [t.waBuildIntro];
    var any = false;
    REF_DEFS.forEach(function(r,i){
      if(state[i] > 0){
        any = true;
        lines.push(t.waLineTemplate
          .replace('{name}', t.refNames[r.key])
          .replace('{thickness}', r.thickness)
          .replace('{crates}', state[i])
          .replace('{sqm}', fmt(state[i]*perCrate(r),0)));
      }
    });
    if(!any){ lines.push(t.waNoSelection); }
    var offer = document.getElementById('offerPrice').value;
    if(offer){ lines.push(t.waOfferLine.replace('{offer}', offer)); }
    else { lines.push(t.waAskPrice); }
    return lines.join("\n");
  }

  function waLink(){ return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(buildMessage()); }

  function refreshWaLinks(){
    var t = I18N[lang];
    var generic = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(t.waGenericMessage.replace('{sqm}', fmt(8230.66)));
    ["topWaBtn","heroWaBtn","contactWaBtn"].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.href = generic;
    });
    document.getElementById('sendBtn').onclick = function(){ window.open(waLink(), '_blank', 'noopener'); };
  }

  function applyLang(newLang){
    lang = SUPPORTED.indexOf(newLang) !== -1 ? newLang : 'en';
    var t = I18N[lang];
    applyStaticText(t);
    renderStockTable(t);
    renderBuilder(t);
    refresh();
    refreshWaLinks();
    document.getElementById('langSelect').value = lang;
    try{ localStorage.setItem('noxem_lang', lang); }catch(e){}
  }

  document.getElementById('selectAll').addEventListener('change', function(e){
    state = REF_DEFS.map(function(r){ return e.target.checked ? r.crates : 0; });
    refresh();
  });
  document.getElementById('offerPrice').addEventListener('input', refresh);
  document.getElementById('langSelect').addEventListener('change', function(e){ applyLang(e.target.value); });

  try{
    var saved = JSON.parse(localStorage.getItem('noxem_destock_selection') || 'null');
    if(saved && saved.length === REF_DEFS.length){ state = saved.map(function(v,i){ return Math.min(v, REF_DEFS[i].crates); }); }
  }catch(e){}

  applyLang(detectLang());

  try{
    var savedOffer = localStorage.getItem('noxem_destock_offer');
    if(savedOffer){ document.getElementById('offerPrice').value = savedOffer; refresh(); }
  }catch(e){}
})();
</script>
</body>
</html>
